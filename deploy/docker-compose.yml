# Your own link, in one command:  docker compose -f deploy/docker-compose.yml up -d
#
# Two containers: the bot (chat UI + API + autopilot) and Caddy (HTTPS + auth).
# Everything the bot needs is in ../config.toml, which is mounted read-only.

name: post-bot

services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    image: post-bot:local
    container_name: post-bot
    command: >
      python -m app.bot.cli serve
      --host 0.0.0.0 --port 8080 --trust-proxy --autopilot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MPT_BOT_PUBLIC_URL: ${PUBLIC_URL:-https://bot.example.com}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://bot.example.com}
    volumes:
      # Credentials and settings stay on the host; the container only reads them.
      - ../config.toml:/MoneyPrinterTurbo/config.toml:ro
      - ../storage:/MoneyPrinterTurbo/storage
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/bot/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Not published to the host: only Caddy can reach it.
    expose:
      - "8080"

  caddy:
    image: caddy:2
    container_name: post-bot-caddy
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-bot.example.com}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?run caddy hash-password first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
