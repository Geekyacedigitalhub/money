<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Post Bot</title>
  <link rel="stylesheet" href="/bot/assets/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🎬</div>
        <div>
          <h1 id="botName">Post Bot</h1>
          <p class="sub" id="statusLine">Connecting…</p>
        </div>
      </div>
      <button class="ghost" id="guidesBtn" title="Platform rules">📏</button>
    </header>

    <div class="platforms" id="platformBar" aria-label="Publishing platforms"></div>

    <main class="messages" id="messages">
      <div class="empty" id="emptyState">
        <div class="empty-icon">💬</div>
        <h2 id="emptyHeading">What should I make?</h2>
        <p>Send a topic. I'll script it, voice it, subtitle it, and post it to
           Facebook, YouTube, TikTok and Instagram.</p>
        <div class="suggestions">
          <button data-suggest="Inflation in Nigeria explained in 60 seconds">Inflation in Nigeria</button>
          <button data-suggest="3 things to check before renting an apartment in Lagos">Lagos rental tips</button>
          <button data-suggest="Why the naira keeps losing value">Why the naira falls</button>
        </div>
        <p class="tiny">Or send an MP4 you already made — I'll publish that instead.</p>
      </div>
    </main>

    <div class="typing" id="typing" hidden>
      <span></span><span></span><span></span>
      <em id="typingText">Working…</em>
    </div>

    <footer class="composer">
      <button class="icon" id="attachBtn" title="Send an existing video">📎</button>
      <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm,video/x-matroska" hidden />
      <textarea id="input" rows="1" placeholder="Send a topic…" autocomplete="off"></textarea>
      <button class="send" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12 2-12 2z"/>
        </svg>
      </button>
    </footer>
  </div>

  <div class="sheet" id="guidesSheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h3>Platform rules</h3>
        <button class="ghost" id="guidesClose">✕</button>
      </div>
      <div class="sheet-body" id="guidesBody">Loading…</div>
    </div>
  </div>

  <script src="/bot/assets/app.js"></script>
</body>
</html>
